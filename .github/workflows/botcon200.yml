name: nofake

on:
  workflow_dispatch:
    inputs:
      haxball_rooms:
        description: "Links de las salas (separados por coma)"
        required: true
        default: "https://www.haxball.com/play?c=1n05nbF698Q,https://www.haxball.com/play?c=2,https://www.haxball.com/play?c=3"
      mensaje:
        description: "Mensaje principal"
        required: true
        default: "Hola"
      llamar_admin:
        description: "Mensaje para llamar al administrador"
        required: true
        default: "admin"
      delay:
        description: "Delay en milisegundos"
        required: true
        default: "500"


    env:
      HAXBALL_ROOMS: ${{ github.event.inputs.haxball_rooms }}
      MENSAJE: ${{ github.event.inputs.mensaje }}
      LLAMAR_ADMIN: ${{ github.event.inputs.llamar_admin }}
      DELAY: ${{ github.event.inputs.delay }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Instalar dependencias
        run: |
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
          npm ci

      - name: Ejecutar bot (retry solo Puppeteer)
        run: |
          MAX=3
          COUNT=1

          while [ $COUNT -le $MAX ]; do
            echo "Intento $COUNT/$MAX"
            node botsstefano.js 2> error.log && exit 0

            if grep -Ei "puppeteer|chrome|chromium|browser|Target closed|Session closed" error.log; then
              echo "Error de Puppeteer detectado, reintentando..."
              COUNT=$((COUNT+1))
              sleep 5
            else
              echo "Error NO relacionado con Puppeteer, abortando."
              cat error.log
              exit 1
            fi
          done

          echo "Falló Puppeteer después de $MAX intentos"
          exit 1
        env:
          JOB_INDEX: ${{ matrix.job_index }}
          JOB_ID: ${{ matrix.job_id }}
        timeout-minutes: 60
